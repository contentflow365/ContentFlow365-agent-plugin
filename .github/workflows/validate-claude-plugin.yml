name: Validate Claude plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code on the GitHub runner
        run: npm install --global @anthropic-ai/claude-code
      - name: Validate plugin and marketplace metadata
        run: claude plugin validate --strict .
